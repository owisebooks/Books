<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>အိုဝိုက်စ်(မောင်ငံ)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.5; }

    /* Header with Blurred Custom Background Image */
    header { 
      position: relative;
      background-color: #1e293b;
      background-image: linear-gradient(rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.65)), url('nadwi-cover.jpg'); 
      background-size: cover;
      background-position: center;
      color: white; 
      padding: 60px 20px; 
      text-align: center; 
      overflow: hidden;
    }
    header h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 10px; position: relative; z-index: 1; }
    header p { color: #e2e8f0; font-size: 1rem; max-width: 600px; margin: 0 auto; position: relative; z-index: 1; }

    /* Container */
    .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }

    /* Book List Layout */
    .book-list { display: flex; flex-direction: column; gap: 20px; }
    .book-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; gap: 20px; align-items: center; transition: transform 0.2s, box-shadow 0.2s; }
    .book-item:hover { transform: translateY(-2px); box-shadow: 0 8px 16px -4px rgba(0,0,0,0.08); }
    
    /* Cover Logo */
    .book-cover { width: 90px; height: 120px; object-fit: cover; border-radius: 6px; background: #e2e8f0; flex-shrink: 0; }
    
    /* Content */
    .book-info { flex-grow: 1; }
    .tag { display: inline-block; background: #eff6ff; color: var(--primary); font-size: 0.75rem; font-weight: 600; padding: 3px 8px; border-radius: 12px; text-transform: uppercase; margin-bottom: 8px; }
    .book-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 6px; }
    .book-desc { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 12px; }
    
    /* Download Link */
    .btn-download { display: inline-block; background: var(--primary); color: white; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; text-decoration: none; transition: background 0.2s; }
    .btn-download:hover { background: var(--primary-hover); }

    @media (max-width: 600px) {
      .book-item { flex-direction: column; text-align: center; }
      .tag { align-self: center; }
    }
  </style>
</head>
<body>

  <header>
    <h1>အိုဝိုက်စ်(မောင်ငံ)</h1>
    <p>ရှိုက်ခ်အဗွလ်ဟစန်၏အတွေးအခေါ်များကိုလူငယ်ခေတ်ပညာတတ်များထိတွေမှုရှိစေရန်ရည်ရည်ပါသည်။</p>
  </header>

  <div class="container">
    <div class="book-list" id="bookGrid"></div>
  </div>

  <script>
    fetch('books.json')
      .then(res => res.json())
      .then(books => {
        const grid = document.getElementById('bookGrid');
        grid.innerHTML = '';

        books.forEach(book => {
          const item = document.createElement('div');
          item.className = 'book-item';
          item.innerHTML = `
            <img src="${book.cover}" alt="${book.title}" class="book-cover" onerror="this.onerror=null; this.src='https://via.placeholder.com/90x120?text=Book';">
            <div class="book-info">
              <span class="tag">${book.category}</span>
              <h2 class="book-title">${book.title}</h2>
              <p class="book-desc">${book.description}</p>
              <a href="${book.file}" download="${book.title}.pdf" class="btn-download">Download PDF</a>
            </div>
          `;
          grid.appendChild(item);
        });
      })
      .catch(err => console.error("Error loading books:", err));
  </script>

</body>
</html>
